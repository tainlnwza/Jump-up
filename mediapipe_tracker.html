<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jump Up - MediaPipe AI Pose & Real-Time Tracker</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <!-- MediaPipe Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
    <style>
        :root {
            --primary: #00E5FF;
            --accent: #FF5252;
            --success: #00E676;
            --bg-dark: #0A0E1A;
            --card-bg: rgba(18, 26, 46, 0.85);
        }

        body {
            margin: 0;
            padding: 20px;
            background-color: var(--bg-dark);
            color: #ffffff;
            font-family: 'Prompt', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .title {
            font-family: 'Rajdhani', sans-serif;
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: 2px;
            margin: 0;
            text-shadow: 0 0 15px rgba(0, 229, 255, 0.4);
        }

        .subtitle {
            font-size: 0.95rem;
            color: #90A4AE;
            margin-top: 5px;
        }

        .container {
            display: flex;
            gap: 20px;
            max-width: 1200px;
            width: 100%;
            flex-wrap: wrap;
            justify-content: center;
        }

        .video-card {
            position: relative;
            background: var(--card-bg);
            border-radius: 16px;
            padding: 12px;
            border: 1px solid rgba(0, 229, 255, 0.25);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            width: 640px;
            height: 480px;
            overflow: hidden;
        }

        #webcam {
            display: none;
        }

        #output_canvas {
            width: 100%;
            height: 100%;
            border-radius: 12px;
            background: #050811;
            transform: scaleX(-1); /* Mirror camera */
        }

        .status-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 380px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .action-banner {
            background: rgba(0, 0, 0, 0.4);
            border: 2px solid var(--primary);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
        }

        .action-label {
            font-size: 0.85rem;
            color: #78909C;
            text-transform: uppercase;
        }

        .action-value {
            font-family: 'Rajdhani', sans-serif;
            font-size: 2rem;
            font-weight: 700;
            color: #FFD700;
            margin-top: 4px;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .stat-box {
            background: rgba(0, 0, 0, 0.25);
            padding: 10px 14px;
            border-radius: 8px;
            border-left: 3px solid var(--primary);
        }

        .stat-name { font-size: 0.8rem; color: #90A4AE; }
        .stat-num { font-size: 1.2rem; font-weight: 600; color: #fff; }

        .btn {
            background: linear-gradient(135deg, #00B0FF, #00E5FF);
            color: #000;
            border: none;
            padding: 14px 20px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 229, 255, 0.4);
        }

        .toggle-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.9rem;
            color: #CFD8DC;
            background: rgba(0, 0, 0, 0.2);
            padding: 10px 14px;
            border-radius: 8px;
        }

        .indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #FF5252;
            margin-right: 6px;
        }

        .indicator.online { background: #00E676; box-shadow: 0 0 8px #00E676; }
    </style>
</head>
<body>

    <div class="header">
        <h1 class="title">JUMP UP - MEDIAPIPE AI TRACKER</h1>
        <div class="subtitle">ระบบ AI ตรวจจับท่าทาง & ส่งภาพเรียลไทม์เข้า Unity (30-60 FPS)</div>
    </div>

    <div class="container">
        <div class="video-card">
            <video id="webcam" playsinline></video>
            <canvas id="output_canvas" width="640" height="480"></canvas>
        </div>

        <div class="status-card">
            <div>
                <span class="indicator" id="unity_indicator"></span>
                <span id="unity_status_text">กำลังเชื่อมต่อ Unity (localhost:8080)...</span>
            </div>

            <div class="action-banner">
                <div class="action-label">ท่าทางที่ตรวจจับได้ (Current Action)</div>
                <div class="action-value" id="detected_action">READY</div>
            </div>

            <div class="toggle-row">
                <span>📡 ส่งภาพวิดีโอสดเข้า Unity</span>
                <input type="checkbox" id="stream_toggle" checked style="width: 20px; height: 20px; cursor: pointer;">
            </div>

            <div class="stat-grid">
                <div class="stat-box">
                    <div class="stat-name">Boss HP</div>
                    <div class="stat-num" id="boss_hp_text">-</div>
                </div>
                <div class="stat-box">
                    <div class="stat-name">Player HP</div>
                    <div class="stat-num" id="player_hp_text">-</div>
                </div>
                <div class="stat-box">
                    <div class="stat-name">FPS กล้องจริง</div>
                    <div class="stat-num" id="fps_text">0</div>
                </div>
                <div class="stat-box">
                    <div class="stat-name">Latency</div>
                    <div class="stat-num" id="latency_text">< 10ms</div>
                </div>
            </div>

            <button class="btn" id="start_btn" onclick="startCamera()">📷 เริ่มเปิดกล้องตรวจจับท่าทาง (Real-Time)</button>
        </div>
    </div>

    <script>
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const actionDisplay = document.getElementById('detected_action');
        const unityIndicator = document.getElementById('unity_indicator');
        const unityStatusText = document.getElementById('unity_status_text');
        const streamToggle = document.getElementById('stream_toggle');
        const fpsDisplay = document.getElementById('fps_text');

        // Offscreen canvas for super lightweight frame transmission to Unity
        const offscreenCanvas = document.createElement('canvas');
        offscreenCanvas.width = 256;
        offscreenCanvas.height = 192;
        const offscreenCtx = offscreenCanvas.getContext('2d');

        let isRunning = false;
        let isProcessing = false;
        let isSendingFrame = false;
        let lastActionSentTime = 0;
        let lastFrameSentTime = 0;
        let frameCount = 0;
        let lastFpsTime = performance.now();

        const ACTION_COOLDOWN_MS = 600;
        const STREAM_INTERVAL_MS = 120; // ~8 FPS stream to Unity is plenty and ultra lightweight

        // Check Unity Connection
        async function checkUnity() {
            try {
                const res = await fetch('http://localhost:8080/battle/status');
                if (res.ok) {
                    const data = await res.json();
                    unityIndicator.classList.add('online');
                    unityStatusText.innerText = '✅ เชื่อมต่อ Unity Battle สำเร็จ';
                    if (data.bossHp !== undefined) document.getElementById('boss_hp_text').innerText = data.bossHp;
                    if (data.playerHp !== undefined) document.getElementById('player_hp_text').innerText = data.playerHp;
                }
            } catch (err) {
                unityIndicator.classList.remove('online');
                unityStatusText.innerText = '❌ Unity ยังไม่ได้กด Play';
            }
        }
        setInterval(checkUnity, 2000);

        // Send Player Action to Unity (Non-blocking)
        function sendActionToUnity(actionName) {
            const now = Date.now();
            if (now - lastActionSentTime < ACTION_COOLDOWN_MS) return;
            lastActionSentTime = now;

            actionDisplay.innerText = actionName.toUpperCase() + ' !';
            actionDisplay.style.color = '#00E5FF';

            // Fire and forget (never await in render loop!)
            fetch('http://localhost:8080/execute', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ player_action: actionName })
            }).catch(() => {});
        }

        // Stream Lightweight Frame to Unity (Completely Decoupled)
        function streamFrameToUnity() {
            if (!streamToggle.checked || isSendingFrame) return;
            const now = Date.now();
            if (now - lastFrameSentTime < STREAM_INTERVAL_MS) return;
            lastFrameSentTime = now;
            isSendingFrame = true;

            // Downscale to 256x192 JPEG (~4KB)
            offscreenCtx.drawImage(canvasElement, 0, 0, 256, 192);
            const dataUrl = offscreenCanvas.toDataURL('image/jpeg', 0.5);

            fetch('http://localhost:8080/player/frame', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ image: dataUrl })
            }).finally(() => {
                isSendingFrame = false;
            }).catch(() => {});
        }

        // Initialize MediaPipe Pose with LITE Model (High FPS, No Freeze)
        const pose = new Pose({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
        });

        pose.setOptions({
            modelComplexity: 0,        // 0 = LITE (Fastest, 30-60 FPS for Web, prevents freezing)
            smoothLandmarks: true,
            enableSegmentation: true,  // Background removal
            smoothSegmentation: false, // False = Fast direct segmentation without heavy frame lag
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        pose.onResults(onPoseResults);

        function onPoseResults(results) {
            frameCount++;
            const now = performance.now();
            if (now - lastFpsTime >= 1000) {
                fpsDisplay.innerText = frameCount;
                frameCount = 0;
                lastFpsTime = now;
            }

            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

            // 1. Draw Background-Removed Person
            if (results.segmentationMask) {
                canvasCtx.drawImage(results.segmentationMask, 0, 0, canvasElement.width, canvasElement.height);
                canvasCtx.globalCompositeOperation = 'source-in';
                canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
                canvasCtx.globalCompositeOperation = 'destination-over';
                canvasCtx.fillStyle = '#050811';
                canvasCtx.fillRect(0, 0, canvasElement.width, canvasElement.height);
                canvasCtx.globalCompositeOperation = 'source-over';
            } else {
                canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
            }

            // 2. Detect Actions from Landmarks
            if (results.poseLandmarks) {
                const lm = results.poseLandmarks;

                const nose = lm[0];
                const leftShoulder = lm[11];
                const rightShoulder = lm[12];
                const leftWrist = lm[15];
                const rightWrist = lm[16];
                const leftHip = lm[23];
                const rightHip = lm[24];
                const leftKnee = lm[25];
                const rightKnee = lm[26];

                // Draw skeleton landmarks
                drawConnectors(canvasCtx, results.poseLandmarks, POSE_CONNECTIONS, { color: '#00E5FF', lineWidth: 3 });
                drawLandmarks(canvasCtx, results.poseLandmarks, { color: '#FF5252', lineWidth: 2, radius: 4 });

                // Detect: Punch
                if ((leftWrist.x > leftShoulder.x + 0.16) || (rightWrist.x < rightShoulder.x - 0.16)) {
                    sendActionToUnity('Punch');
                }
                // Detect: Uppercut
                else if ((leftWrist.y < nose.y - 0.04) || (rightWrist.y < nose.y - 0.04)) {
                    sendActionToUnity('Uppercut');
                }
                // Detect: Squat
                else if (leftHip && leftKnee && rightHip && rightKnee) {
                    if ((leftKnee.y - leftHip.y < 0.24) && (rightKnee.y - rightHip.y < 0.24)) {
                        sendActionToUnity('Squat');
                    }
                }
            }
            canvasCtx.restore();

            // 3. Stream frame asynchronously (never delays canvas rendering)
            streamFrameToUnity();

            isProcessing = false;
        }

        async function startCamera() {
            if (isRunning) return;
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { width: 640, height: 480, frameRate: { ideal: 30 } }
                });
                videoElement.srcObject = stream;
                await videoElement.play();

                const camera = new Camera(videoElement, {
                    onFrame: async () => {
                        if (isProcessing) return; // Skip frame if AI is still calculating (prevents frame queue lock)
                        isProcessing = true;
                        await pose.send({ image: videoElement });
                    },
                    width: 640,
                    height: 480
                });
                await camera.start();
                isRunning = true;
                document.getElementById('start_btn').innerText = '🟢 กำลังตรวจจับแบบเรียลไทม์...';
                document.getElementById('start_btn').style.background = '#00E676';
            } catch (err) {
                alert('เกิดข้อผิดพลาด: ' + err.message + '\n\nวิธีแก้: หากกล้องติดค้าง ให้ปิดแท็บนี้แล้วเปิดใหม่ หรือตรวจสอบว่าไม่มีโปรแกรมอื่นล็อกกล้องอยู่ครับ');
            }
        }
    </script>
</body>
</html>
