<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jump Up - MediaPipe AI Pose Tracker (Fast Real-Time)</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <!-- MediaPipe Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
    <style>
        :root {
            --primary: #00E5FF;
            --accent: #FF5252;
            --success: #00E676;
            --bg-dark: #0A0E1A;
            --card-bg: rgba(18, 26, 46, 0.85);
        }

        body {
            margin: 0;
            padding: 20px;
            background-color: var(--bg-dark);
            color: #ffffff;
            font-family: 'Prompt', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .title {
            font-family: 'Rajdhani', sans-serif;
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: 2px;
            margin: 0;
            text-shadow: 0 0 15px rgba(0, 229, 255, 0.4);
        }

        .subtitle {
            font-size: 0.95rem;
            color: #90A4AE;
            margin-top: 5px;
        }

        .container {
            display: flex;
            gap: 20px;
            max-width: 1200px;
            width: 100%;
            flex-wrap: wrap;
            justify-content: center;
        }

        .video-card {
            position: relative;
            background: var(--card-bg);
            border-radius: 16px;
            padding: 12px;
            border: 1px solid rgba(0, 229, 255, 0.25);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            width: 640px;
            height: 480px;
            overflow: hidden;
        }

        #webcam {
            display: none;
        }

        #output_canvas {
            width: 100%;
            height: 100%;
            border-radius: 12px;
            background: #050811;
            transform: scaleX(-1); /* Mirror camera */
        }

        .status-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 380px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .action-banner {
            background: rgba(0, 0, 0, 0.4);
            border: 2px solid var(--primary);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
        }

        .action-label {
            font-size: 0.85rem;
            color: #78909C;
            text-transform: uppercase;
        }

        .action-value {
            font-family: 'Rajdhani', sans-serif;
            font-size: 2.2rem;
            font-weight: 700;
            color: #FFD700;
            margin-top: 4px;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .stat-box {
            background: rgba(0, 0, 0, 0.25);
            padding: 10px 14px;
            border-radius: 8px;
            border-left: 3px solid var(--primary);
        }

        .stat-name { font-size: 0.8rem; color: #90A4AE; }
        .stat-num { font-size: 1.2rem; font-weight: 600; color: #fff; }

        .btn {
            background: linear-gradient(135deg, #00B0FF, #00E5FF);
            color: #000;
            border: none;
            padding: 14px 20px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 229, 255, 0.4);
        }

        .indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #FF5252;
            margin-right: 6px;
        }

        .indicator.online { background: #00E676; box-shadow: 0 0 8px #00E676; }

        .mode-tag {
            background: rgba(0, 229, 255, 0.15);
            border: 1px solid var(--primary);
            color: var(--primary);
            font-size: 0.8rem;
            padding: 4px 10px;
            border-radius: 6px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1 class="title">JUMP UP - MEDIAPIPE AI POSE TRACKER</h1>
        <div class="subtitle">ระบบตรวจจับท่าทางร่างกายเรียลไทม์ 60 FPS (ส่งเฉพาะข้อมูลท่าทาง ไม่ส่งภาพ)</div>
    </div>

    <div class="container">
        <div class="video-card">
            <video id="webcam" playsinline></video>
            <canvas id="output_canvas" width="640" height="480"></canvas>
        </div>

        <div class="status-card">
            <div>
                <span class="indicator" id="unity_indicator"></span>
                <span id="unity_status_text">กำลังเชื่อมต่อ Unity (localhost:8080)...</span>
            </div>

            <div class="mode-tag">⚡ Ultra-Fast Mode: ส่งเฉพาะ Action (ไม่มีแล็ก 100%)</div>

            <div class="action-banner">
                <div class="action-label">ท่าทางที่ตรวจจับได้ (Current Action)</div>
                <div class="action-value" id="detected_action">READY</div>
            </div>

            <div class="stat-grid">
                <div class="stat-box">
                    <div class="stat-name">Boss HP</div>
                    <div class="stat-num" id="boss_hp_text">-</div>
                </div>
                <div class="stat-box">
                    <div class="stat-name">Player HP</div>
                    <div class="stat-num" id="player_hp_text">-</div>
                </div>
                <div class="stat-box">
                    <div class="stat-name">กล้อง FPS</div>
                    <div class="stat-num" id="fps_text">0</div>
                </div>
                <div class="stat-box">
                    <div class="stat-name">สถานะระบบ</div>
                    <div class="stat-num" style="color: #00E676;">Smooth</div>
                </div>
            </div>

            <button class="btn" id="start_btn" onclick="startCamera()">📷 เปิดกล้องตรวจจับท่าทาง (Real-Time 60 FPS)</button>
        </div>
    </div>

    <script>
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const actionDisplay = document.getElementById('detected_action');
        const unityIndicator = document.getElementById('unity_indicator');
        const unityStatusText = document.getElementById('unity_status_text');
        const fpsDisplay = document.getElementById('fps_text');

        let isRunning = false;
        let isProcessing = false;
        let lastActionSentTime = 0;
        let frameCount = 0;
        let lastFpsTime = performance.now();

        const ACTION_COOLDOWN_MS = 600; // Cooldown between actions to prevent double-firing

        // Check Unity Connection
        async function checkUnity() {
            try {
                const res = await fetch('http://localhost:8080/battle/status');
                if (res.ok) {
                    const data = await res.json();
                    unityIndicator.classList.add('online');
                    unityStatusText.innerText = '✅ เชื่อมต่อ Unity Battle สำเร็จ';
                    if (data.bossHp !== undefined) document.getElementById('boss_hp_text').innerText = data.bossHp;
                    if (data.playerHp !== undefined) document.getElementById('player_hp_text').innerText = data.playerHp;
                }
            } catch (err) {
                unityIndicator.classList.remove('online');
                unityStatusText.innerText = '❌ Unity ยังไม่ได้กด Play';
            }
        }
        setInterval(checkUnity, 2000);

        // Send ONLY Action Data to Unity (Fire & Forget, No Image Data)
        function sendActionToUnity(actionName) {
            const now = Date.now();
            if (now - lastActionSentTime < ACTION_COOLDOWN_MS) return;
            lastActionSentTime = now;

            actionDisplay.innerText = actionName.toUpperCase() + ' !';
            actionDisplay.style.color = '#00E5FF';

            // Send small lightweight JSON command to Unity
            fetch('http://localhost:8080/execute', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ player_action: actionName })
            }).catch(() => {});
        }

        // Initialize MediaPipe Pose with Ultra-Lite Settings
        const pose = new Pose({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
        });

        pose.setOptions({
            modelComplexity: 0,        // 0 = Lite (Fastest, 60 FPS, Zero Freeze)
            smoothLandmarks: true,
            enableSegmentation: false, // Disabled heavy segmentation to ensure 100% smooth video
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        pose.onResults(onPoseResults);

        function onPoseResults(results) {
            frameCount++;
            const now = performance.now();
            if (now - lastFpsTime >= 1000) {
                fpsDisplay.innerText = frameCount;
                frameCount = 0;
                lastFpsTime = now;
            }

            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

            // Draw video directly onto canvas (Ultra smooth 60 FPS)
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            // Detect & Draw Body Skeleton
            if (results.poseLandmarks) {
                const lm = results.poseLandmarks;

                const nose = lm[0];
                const leftShoulder = lm[11];
                const rightShoulder = lm[12];
                const leftWrist = lm[15];
                const rightWrist = lm[16];
                const leftHip = lm[23];
                const rightHip = lm[24];
                const leftKnee = lm[25];
                const rightKnee = lm[26];

                // Draw skeleton connectors & landmarks
                drawConnectors(canvasCtx, results.poseLandmarks, POSE_CONNECTIONS, { color: '#00E5FF', lineWidth: 3 });
                drawLandmarks(canvasCtx, results.poseLandmarks, { color: '#FF5252', lineWidth: 2, radius: 4 });

                // 1. Detect PUNCH: Either wrist extended forward horizontally
                if ((leftWrist && leftShoulder && leftWrist.x > leftShoulder.x + 0.16) ||
                    (rightWrist && rightShoulder && rightWrist.x < rightShoulder.x - 0.16)) {
                    sendActionToUnity('Punch');
                }
                // 2. Detect UPPERCUT: Either wrist raised above nose
                else if ((leftWrist && nose && leftWrist.y < nose.y - 0.05) ||
                         (rightWrist && nose && rightWrist.y < nose.y - 0.05)) {
                    sendActionToUnity('Uppercut');
                }
                // 3. Detect SQUAT: Knees bent and hips lowered
                else if (leftHip && leftKnee && rightHip && rightKnee) {
                    if ((leftKnee.y - leftHip.y < 0.24) && (rightKnee.y - rightHip.y < 0.24)) {
                        sendActionToUnity('Squat');
                    }
                }
            }
            canvasCtx.restore();

            isProcessing = false;
        }

        // Real-Time Animation Loop (Smooth 60 FPS, Never Freezes)
        let animId = null;
        async function processVideoLoop() {
            if (!isRunning) return;
            if (!isProcessing && videoElement.readyState >= 2) {
                isProcessing = true;
                await pose.send({ image: videoElement });
            }
            animId = requestAnimationFrame(processVideoLoop);
        }

        async function startCamera() {
            if (isRunning) return;
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { width: 640, height: 480, frameRate: { ideal: 30 } },
                    audio: false
                });
                videoElement.srcObject = stream;
                await videoElement.play();

                isRunning = true;
                document.getElementById('start_btn').innerText = '🟢 ตรวจจับเรียลไทม์ 60 FPS (ทำงานอยู่)';
                document.getElementById('start_btn').style.background = '#00E676';

                // Launch requestAnimationFrame loop
                animId = requestAnimationFrame(processVideoLoop);
            } catch (err) {
                alert('ไม่สามารถเปิดกล้องได้: ' + err.message);
            }
        }
    </script>
</body>
</html>
