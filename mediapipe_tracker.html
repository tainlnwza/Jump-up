<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jump Up - MediaPipe AI Pose Tracker (Bulletproof 60 FPS)</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <!-- MediaPipe Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
    <style>
        :root {
            --primary: #00E5FF;
            --accent: #FF5252;
            --success: #00E676;
            --bg-dark: #0A0E1A;
            --card-bg: rgba(18, 26, 46, 0.85);
        }

        body {
            margin: 0;
            padding: 20px;
            background-color: var(--bg-dark);
            color: #ffffff;
            font-family: 'Prompt', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .title {
            font-family: 'Rajdhani', sans-serif;
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: 2px;
            margin: 0;
            text-shadow: 0 0 15px rgba(0, 229, 255, 0.4);
        }

        .subtitle {
            font-size: 0.95rem;
            color: #90A4AE;
            margin-top: 5px;
        }

        .container {
            display: flex;
            gap: 20px;
            max-width: 1200px;
            width: 100%;
            flex-wrap: wrap;
            justify-content: center;
        }

        .video-card {
            position: relative;
            background: var(--card-bg);
            border-radius: 16px;
            padding: 12px;
            border: 1px solid rgba(0, 229, 255, 0.25);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            width: 640px;
            height: 480px;
            overflow: hidden;
        }

        #webcam {
            display: none;
        }

        #output_canvas {
            width: 100%;
            height: 100%;
            border-radius: 12px;
            background: #050811;
            transform: scaleX(-1); /* Mirror camera */
        }

        .status-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 380px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .action-banner {
            background: rgba(0, 0, 0, 0.4);
            border: 2px solid var(--primary);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
        }

        .action-label {
            font-size: 0.85rem;
            color: #78909C;
            text-transform: uppercase;
        }

        .action-value {
            font-family: 'Rajdhani', sans-serif;
            font-size: 2.2rem;
            font-weight: 700;
            color: #FFD700;
            margin-top: 4px;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .stat-box {
            background: rgba(0, 0, 0, 0.25);
            padding: 10px 14px;
            border-radius: 8px;
            border-left: 3px solid var(--primary);
        }

        .stat-name { font-size: 0.8rem; color: #90A4AE; }
        .stat-num { font-size: 1.2rem; font-weight: 600; color: #fff; }

        .btn {
            background: linear-gradient(135deg, #00B0FF, #00E5FF);
            color: #000;
            border: none;
            padding: 14px 20px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 229, 255, 0.4);
        }

        .indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #FF5252;
            margin-right: 6px;
        }

        .indicator.online { background: #00E676; box-shadow: 0 0 8px #00E676; }

        .log-box {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 0.75rem;
            color: #80D8FF;
            font-family: monospace;
            max-height: 60px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1 class="title">JUMP UP - MEDIAPIPE AI POSE TRACKER</h1>
        <div class="subtitle">ระบบตรวจจับท่าทางร่างกายเรียลไทม์ 60 FPS (ส่งเฉพาะข้อมูลท่าทาง ไม่ส่งภาพ)</div>
    </div>

    <div class="container">
        <div class="video-card">
            <video id="webcam" playsinline></video>
            <canvas id="output_canvas" width="640" height="480"></canvas>
        </div>

        <div class="status-card">
            <div>
                <span class="indicator" id="unity_indicator"></span>
                <span id="unity_status_text">กำลังเชื่อมต่อ Unity (localhost:8080)...</span>
            </div>

            <div class="action-banner">
                <div class="action-label">ท่าทางที่ตรวจจับได้ (Current Action)</div>
                <div class="action-value" id="detected_action">READY</div>
            </div>

            <div class="stat-grid">
                <div class="stat-box">
                    <div class="stat-name">Boss HP</div>
                    <div class="stat-num" id="boss_hp_text">-</div>
                </div>
                <div class="stat-box">
                    <div class="stat-name">Player HP</div>
                    <div class="stat-num" id="player_hp_text">-</div>
                </div>
                <div class="stat-box">
                    <div class="stat-name">FPS กล้องจริง</div>
                    <div class="stat-num" id="fps_text">0</div>
                </div>
                <div class="stat-box">
                    <div class="stat-name">AI Status</div>
                    <div class="stat-num" id="ai_status" style="color: #00E676;">Ready</div>
                </div>
            </div>

            <div class="log-box" id="log_text">System initialized. Click button to start.</div>

            <button class="btn" id="start_btn" onclick="startCamera()">📷 เปิดกล้องตรวจจับท่าทาง (Real-Time 60 FPS)</button>
        </div>
    </div>

    <script>
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const actionDisplay = document.getElementById('detected_action');
        const unityIndicator = document.getElementById('unity_indicator');
        const unityStatusText = document.getElementById('unity_status_text');
        const fpsDisplay = document.getElementById('fps_text');
        const logDisplay = document.getElementById('log_text');

        let isRunning = false;
        let isProcessing = false;
        let lastActionSentTime = 0;
        let latestPoseLandmarks = null;
        let frameCount = 0;
        let lastFpsTime = performance.now();

        const ACTION_COOLDOWN_MS = 600;

        function log(msg) {
            console.log(msg);
            if (logDisplay) logDisplay.innerText = msg;
        }

        // Check Unity Connection
        async function checkUnity() {
            try {
                const res = await fetch('http://localhost:8080/battle/status');
                if (res.ok) {
                    const data = await res.json();
                    unityIndicator.classList.add('online');
                    unityStatusText.innerText = '✅ เชื่อมต่อ Unity Battle สำเร็จ';
                    if (data.bossHp !== undefined) document.getElementById('boss_hp_text').innerText = data.bossHp;
                    if (data.playerHp !== undefined) document.getElementById('player_hp_text').innerText = data.playerHp;
                }
            } catch (err) {
                unityIndicator.classList.remove('online');
                unityStatusText.innerText = '❌ Unity ยังไม่ได้กด Play';
            }
        }
        setInterval(checkUnity, 2000);

        // Send ONLY Action to Unity (Fire & Forget, No Image Data)
        function sendActionToUnity(actionName) {
            const now = Date.now();
            if (now - lastActionSentTime < ACTION_COOLDOWN_MS) return;
            lastActionSentTime = now;

            actionDisplay.innerText = actionName.toUpperCase() + ' !';
            actionDisplay.style.color = '#00E5FF';
            log('Action sent to Unity: ' + actionName);

            fetch('http://localhost:8080/execute', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ player_action: actionName })
            }).catch(() => {});
        }

        // Initialize MediaPipe Pose
        const pose = new Pose({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
        });

        pose.setOptions({
            modelComplexity: 0,        // Lite Model: 60 FPS
            smoothLandmarks: true,
            enableSegmentation: false, // Disabled heavy segmentation to ensure 100% smooth video
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        pose.onResults((results) => {
            try {
                if (results && results.poseLandmarks) {
                    latestPoseLandmarks = results.poseLandmarks;
                    checkCombatPoses(results.poseLandmarks);
                } else {
                    latestPoseLandmarks = null;
                }
            } catch (e) {
                console.error('Error in onResults:', e);
            } finally {
                // ALWAYS unlock processing so next frame is never blocked!
                isProcessing = false;
            }
        });

        // Custom fail-safe skeleton drawer (Zero external dependencies)
        function drawCustomSkeleton(ctx, landmarks) {
            if (!landmarks || landmarks.length === 0) return;

            const connections = [
                [11, 12], // shoulders
                [11, 13], [13, 15], // left arm
                [12, 14], [14, 16], // right arm
                [11, 23], [12, 24], // torso
                [23, 24], // hips
                [23, 25], [25, 27], // left leg
                [24, 26], [26, 28]  // right leg
            ];

            const w = ctx.canvas.width;
            const h = ctx.canvas.height;

            // Draw glowing cyan bones
            ctx.lineWidth = 4;
            ctx.strokeStyle = '#00E5FF';
            ctx.shadowColor = '#00E5FF';
            ctx.shadowBlur = 8;

            for (let i = 0; i < connections.length; i++) {
                const a = landmarks[connections[i][0]];
                const b = landmarks[connections[i][1]];
                if (a && b && (a.visibility === undefined || a.visibility > 0.4) && (b.visibility === undefined || b.visibility > 0.4)) {
                    ctx.beginPath();
                    ctx.moveTo(a.x * w, a.y * h);
                    ctx.lineTo(b.x * w, b.y * h);
                    ctx.stroke();
                }
            }

            ctx.shadowBlur = 0; // Reset shadow

            // Draw joint dots
            ctx.fillStyle = '#FF5252';
            for (let i = 0; i < landmarks.length; i++) {
                const pt = landmarks[i];
                if (pt && (pt.visibility === undefined || pt.visibility > 0.4)) {
                    ctx.beginPath();
                    ctx.arc(pt.x * w, pt.y * h, 5, 0, 2 * Math.PI);
                    ctx.fill();
                }
            }
        }

        // Combat Pose Detection Logic
        function checkCombatPoses(lm) {
            const nose = lm[0];
            const leftShoulder = lm[11];
            const rightShoulder = lm[12];
            const leftWrist = lm[15];
            const rightWrist = lm[16];
            const leftHip = lm[23];
            const rightHip = lm[24];
            const leftKnee = lm[25];
            const rightKnee = lm[26];

            // 1. PUNCH: Either wrist extended forward horizontally
            if ((leftWrist && leftShoulder && leftWrist.x > leftShoulder.x + 0.16) ||
                (rightWrist && rightShoulder && rightWrist.x < rightShoulder.x - 0.16)) {
                sendActionToUnity('Punch');
            }
            // 2. UPPERCUT: Either wrist raised above nose
            else if ((leftWrist && nose && leftWrist.y < nose.y - 0.05) ||
                     (rightWrist && nose && rightWrist.y < nose.y - 0.05)) {
                sendActionToUnity('Uppercut');
            }
            // 3. SQUAT: Knees bent and hips lowered
            else if (leftHip && leftKnee && rightHip && rightKnee) {
                if ((leftKnee.y - leftHip.y < 0.24) && (rightKnee.y - rightHip.y < 0.24)) {
                    sendActionToUnity('Squat');
                }
            }
        }

        // Bulletproof Rendering Loop (Camera NEVER freezes!)
        function mainRenderLoop() {
            if (!isRunning) return;

            frameCount++;
            const now = performance.now();
            if (now - lastFpsTime >= 1000) {
                fpsDisplay.innerText = frameCount;
                frameCount = 0;
                lastFpsTime = now;
            }

            // 1. ALWAYS draw real-time camera feed to canvas (guarantees smooth 60 FPS video!)
            if (videoElement.readyState >= 2) {
                canvasCtx.drawImage(videoElement, 0, 0, canvasElement.width, canvasElement.height);

                // 2. Draw latest AI skeleton overlay on top
                if (latestPoseLandmarks) {
                    drawCustomSkeleton(canvasCtx, latestPoseLandmarks);
                }

                // 3. Send next frame to MediaPipe if AI is idle
                if (!isProcessing) {
                    isProcessing = true;
                    pose.send({ image: videoElement }).catch((err) => {
                        console.warn('Pose send error:', err);
                        isProcessing = false;
                    });
                }
            }

            requestAnimationFrame(mainRenderLoop);
        }

        async function startCamera() {
            if (isRunning) return;
            try {
                log('Requesting camera stream...');
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { width: 640, height: 480, frameRate: { ideal: 30 } },
                    audio: false
                });
                videoElement.srcObject = stream;
                await videoElement.play();

                isRunning = true;
                log('Camera active. Running 60 FPS.');
                document.getElementById('start_btn').innerText = '🟢 กำลังตรวจจับเรียลไทม์ 60 FPS';
                document.getElementById('start_btn').style.background = '#00E676';
                document.getElementById('ai_status').innerText = 'Active (60 FPS)';

                requestAnimationFrame(mainRenderLoop);
            } catch (err) {
                log('Camera Error: ' + err.message);
                alert('ไม่สามารถเปิดกล้องได้: ' + err.message);
            }
        }
    </script>
</body>
</html>
